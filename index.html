<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Baseball Coaching Carousel – On3</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="carousel-root">

    <div class="on3-header">
      <div>
        <h1>College Baseball Coaching Carousel</h1>
        <div class="sub" id="last-updated">Loading…</div>
      </div>
      <img src="on3-logo.jpg" class="on3-logo" alt="On3" />
    </div>

    <div class="stats-row">
      <div class="stat s-hired"><div class="sl">Hires</div><div class="sv" id="c-hired">—</div></div>
      <div class="stat s-open"><div class="sl">Openings</div><div class="sv" id="c-open">—</div></div>
      <div class="stat s-total"><div class="sl">Total moves</div><div class="sv" id="c-total">—</div></div>
    </div>

    <div class="controls">
      <input class="search-box" type="text" id="search-box" placeholder="Search school, coach, conference…" oninput="render()" />
      <div class="filter-group">
        <button class="fbtn active" onclick="setFilter('all',this)">All</button>
        <button class="fbtn" onclick="setFilter('hired',this)">Hired</button>
        <button class="fbtn" onclick="setFilter('open',this)">Open</button>
      </div>
    </div>

    <div class="col-head">
      <div>School</div>
      <div>Coach</div>
      <div>Status</div>
      <div class="align-right">Date</div>
    </div>

    <div id="entries"></div>

    <div class="footer">
      Data compiled by <a href="https://on3.com" target="_blank">On3</a> &nbsp;·&nbsp; Pete Nakos
      &nbsp;·&nbsp; <a href="#" id="reload-link" onclick="loadData(); return false;">Refresh data</a>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
