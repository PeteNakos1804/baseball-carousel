<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

#carousel-root { font-family: 'DM Sans', Georgia, sans-serif; background: #f2f2f2; padding: 24px 16px; color: #1C252C; }

#carousel-root .on3-header { background: #1C252C; border-radius: 8px; padding: 18px 22px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
#carousel-root .on3-header h1 { font-size: 17px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.02em; }
#carousel-root .on3-header .sub { font-size: 12px; color: #8fa0aa; margin-top: 3px; }
#carousel-root .on3-logo { height: 40px; width: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }

#carousel-root .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
#carousel-root .stat { background: #fff; border-radius: 6px; padding: 12px 14px; border: 1px solid #e5e5e5; border-left: 4px solid #1C252C; }
#carousel-root .stat.s-open, #carousel-root .stat.s-total { border-left-color: #F5361A; }
#carousel-root .stat .sl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
#carousel-root .stat .sv { font-size: 24px; font-weight: 700; color: #1C252C; }

#carousel-root .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
#carousel-root .search-box { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; font-family: inherit; color: #1C252C; background: #fff; }
#carousel-root .search-box:focus { outline: 2px solid #F5361A; outline-offset: 1px; border-color: transparent; }
#carousel-root .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
#carousel-root .fbtn { font-size: 12px; font-family: inherit; padding: 7px 13px; border: 1px solid #ddd; border-radius: 5px; background: #fff; cursor: pointer; color: #555; font-weight: 500; transition: background 0.12s, color 0.12s, border-color 0.12s; white-space: nowrap; }
#carousel-root .fbtn:hover { background: #1C252C; color: #fff; border-color: #1C252C; }
#carousel-root .fbtn.active { background: #F5361A; color: #fff; border-color: #F5361A; }

#carousel-root .col-head { display: grid; grid-template-columns: 2.2fr 2fr 1.2fr 72px; gap: 10px; padding: 7px 14px; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.06em; }
#carousel-root .align-right { text-align: right; }

#carousel-root .entry { display: grid; grid-template-columns: 2.2fr 2fr 1.2fr 72px; align-items: center; gap: 10px; padding: 11px 14px; background: #fff; border-radius: 6px; border: 1px solid #e5e5e5; margin-bottom: 5px; transition: border-color 0.12s, box-shadow 0.12s; }
#carousel-root .entry:hover { border-color: #F5361A; box-shadow: 0 2px 8px rgba(245,54,26,0.08); }

#carousel-root .school-cell { display: flex; align-items: center; gap: 10px; }
#carousel-root .school-logo { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
#carousel-root .school-monogram { width: 32px; height: 32px; border-radius: 50%; background: #eee; color: #666; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0.03em; }
#carousel-root .school-name { font-size: 14px; font-weight: 700; color: #1C252C; }
#carousel-root .conf { font-size: 11px; color: #999; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
#carousel-root .coach-name { font-size: 13px; font-weight: 600; color: #1C252C; }

#carousel-root .entry-notes { grid-column: 1 / -1; font-size: 12px; color: #999; font-style: italic; border-top: 1px solid #f0f0f0; padding-top: 7px; margin-top: 4px; line-height: 1.5; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
#carousel-root .intel-link { display: inline-block; font-size: 11px; font-weight: 700; font-style: normal; color: #F5361A; text-decoration: none; border: 1px solid #F5361A; border-radius: 4px; padding: 2px 7px; white-space: nowrap; transition: background 0.12s, color 0.12s; }
#carousel-root .intel-link:hover { background: #F5361A; color: #fff; }
#carousel-root .entry-date { font-size: 12px; color: #aaa; text-align: right; }

#carousel-root .live-wrap { display: flex; align-items: center; gap: 6px; }
#carousel-root .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #F5361A; flex-shrink: 0; animation: on3pulse 1.6s ease-in-out infinite; }
@keyframes on3pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }

#carousel-root .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.02em; }
#carousel-root .b-hired { background: #e8f5e9; color: #2e7d32; }
#carousel-root .b-open { background: #fdecea; color: #F5361A; }
#carousel-root .b-departed { background: #f5f5f5; color: #888; }

#carousel-root .loading-msg, #carousel-root .error-msg, #carousel-root .empty-msg { padding: 20px 14px; font-size: 14px; background: #fff; border-radius: 6px; border: 1px solid #e5e5e5; }
#carousel-root .loading-msg { color: #999; }
#carousel-root .error-msg { color: #F5361A; }
#carousel-root .empty-msg { color: #999; }

#carousel-root .footer { font-size: 11px; color: #bbb; margin-top: 14px; text-align: right; }
#carousel-root .footer a { color: #F5361A; text-decoration: none; }
#carousel-root .footer a:hover { text-decoration: underline; }

@media (max-width: 620px) {
  #carousel-root .stats-row { grid-template-columns: repeat(2, 1fr); }
  #carousel-root .col-head { display: none; }
  #carousel-root .entry { grid-template-columns: 1fr 1fr; row-gap: 6px; }
  #carousel-root .entry-date { text-align: left; }
}
</style>

<div id="carousel-root">

  <div class="on3-header">
    <div>
      <h1>College Baseball Coaching Carousel</h1>
      <div class="sub" id="last-updated">Loading…</div>
    </div>
    <img src="https://on3static.com/static/on3/on3-red.jpeg?v=2" class="on3-logo" alt="On3" />
  </div>

  <div class="stats-row">
    <div class="stat s-hired"><div class="sl">Hires</div><div class="sv" id="c-hired">—</div></div>
    <div class="stat s-open"><div class="sl">Openings</div><div class="sv" id="c-open">—</div></div>
    <div class="stat s-total"><div class="sl">Total moves</div><div class="sv" id="c-total">—</div></div>
  </div>

  <div class="controls">
    <input class="search-box" type="text" id="search-box" placeholder="Search school, coach, conference…" oninput="render()" />
    <div class="filter-group">
      <button class="fbtn active" onclick="setFilter('all',this)">All</button>
      <button class="fbtn" onclick="setFilter('hired',this)">Hired</button>
      <button class="fbtn" onclick="setFilter('open',this)">Open</button>
    </div>
  </div>

  <div class="col-head">
    <div>School</div>
    <div>Coach</div>
    <div>Status</div>
    <div class="align-right">Date</div>
  </div>

  <div id="entries"></div>

  <div class="footer">
    Data compiled by <a href="https://on3.com" target="_blank">On3</a> &nbsp;·&nbsp; Pete Nakos
    &nbsp;·&nbsp; <a href="#" id="reload-link" onclick="loadData(); return false;">Refresh data</a>
  </div>

</div>

<script>
var allMoves = [];
var currentFilter = "all";

var SHEET_ID = "1SvClToAJCfuOkJcJDMpS9SUZudLf3cqBiuIV_wURKbU";
var SHEET_TAB = "Sheet1";
var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(SHEET_TAB);

var SCHOOL_LOGO_IDS = {
  "air force": 2005, "alabama": 333, "appalachian state": 2026, "arizona": 12,
  "arizona state": 9, "arkansas": 8, "army": 349, "auburn": 2,
  "ball state": 2050, "baylor": 239, "boise state": 68, "boston college": 103,
  "brigham young": 252, "byu": 252, "cal": 25, "california": 25,
  "central florida": 2116, "ucf": 2116, "charlotte": 2429, "cincinnati": 2132,
  "clemson": 228, "coastal carolina": 324, "college of charleston": 232,
  "colorado": 38, "colorado state": 36, "connecticut": 41, "uconn": 41,
  "creighton": 156, "dallas baptist": 2199, "dartmouth": 334, "duke": 150,
  "east carolina": 151, "eastern kentucky": 2198, "florida": 57,
  "florida atlantic": 2226, "florida state": 52, "fresno state": 278,
  "georgia": 61, "georgia tech": 59, "grand canyon": 2253, "hawaii": 62,
  "houston": 248, "illinois": 356, "illinois state": 2210, "indiana": 84,
  "iowa": 2294, "iowa state": 66, "jacksonville state": 55, "kansas": 2305,
  "kansas state": 2306, "kentucky": 96, "liberty": 2335, "louisiana": 309,
  "louisiana tech": 2348, "louisville": 97, "lsu": 99, "maine": 311,
  "maryland": 120, "memphis": 235, "miami": 2390, "miami (fl)": 2390,
  "michigan": 130, "michigan state": 127, "middle tennessee": 2393,
  "minnesota": 135, "mississippi state": 344, "miss. state": 344,
  "missouri": 142, "navy": 2426, "nebraska": 158, "nevada": 2440,
  "new mexico": 167, "north carolina": 153, "nc state": 152,
  "north carolina state": 152, "notre dame": 87, "ohio state": 194,
  "oklahoma": 201, "oklahoma state": 197, "ole miss": 145,
  "oral roberts": 198, "oregon": 2483, "oregon state": 204, "penn state": 213,
  "pittsburgh": 221, "purdue": 2509, "rice": 242, "rutgers": 164,
  "sam houston": 2534, "south carolina": 2579, "south florida": 58,
  "usf": 58, "southeastern louisiana": 2545, "southern miss": 2572,
  "stanford": 24, "stetson": 56, "stony brook": 2583, "syracuse": 183,
  "tcu": 2628, "tennessee": 2633, "texas": 251, "texas a&m": 245,
  "texas state": 326, "texas tech": 2641, "troy": 2653, "tulane": 2655,
  "uab": 5, "ucla": 26, "usc": 30, "utah": 254, "vanderbilt": 238,
  "villanova": 222, "virginia": 258, "virginia tech": 259, "wake forest": 154,
  "washington": 264, "west virginia": 277, "western carolina": 2717,
  "wichita state": 2724, "william & mary": 2725, "winthrop": 2733, "xavier": 2752
};

document.addEventListener("DOMContentLoaded", function () { loadData(); });

function loadData() {
  var entriesEl = document.getElementById("entries");
  entriesEl.innerHTML = '<div class="loading-msg">Loading data…</div>';
  fetch(SHEET_CSV_URL)
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(function (csv) {
      allMoves = parseCSV(csv);
      var now = new Date();
      finishLoad("Updated " + now.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }));
    })
    .catch(function (err) {
      entriesEl.innerHTML = '<div class="error-msg">Could not load data. Make sure the sheet is public.<br><small>' + err.message + "</small></div>";
    });
}

function finishLoad(subtitle) {
  document.getElementById("last-updated").textContent = "2026 offseason · " + subtitle;
  updateCounts();
  render();
}

function parseCSV(text) {
  var lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  var headers = splitCSVLine(lines[0]).map(function (h) { return h.toLowerCase().trim(); });
  var ci = function (n) { return headers.indexOf(n); };
  var iSchool = ci("school"), iConf = ci("conf"), iStatus = ci("status"),
      iCoach = ci("coach"), iNotes = ci("notes"), iDate = ci("date"), iLink = ci("link");
  var moves = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = splitCSVLine(lines[i]);
    if (!cols.length || !cols[iSchool]) continue;
    var status = (cols[iStatus] || "").toLowerCase().trim();
    if (!["hired","open","search","departed"].includes(status)) continue;
    moves.push({ school: clean(cols[iSchool]), conf: clean(cols[iConf]), status: status,
                 coach: clean(cols[iCoach]) || "—", notes: clean(cols[iNotes]) || "",
                 date: clean(cols[iDate]) || "", link: clean(cols[iLink]) || "" });
  }
  return moves;
}

function splitCSVLine(line) {
  var result = [], current = "", inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; } }
    else if (ch === "," && !inQuotes) { result.push(current); current = ""; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

function clean(val) { return (val || "").trim().replace(/^"|"$/g, ""); }

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll(".fbtn").forEach(function (b) { b.classList.remove("active"); });
  btn.classList.add("active");
  render();
}

function render() {
  var q = document.getElementById("search-box").value.toLowerCase();
  var filtered = allMoves.filter(function (m) {
    var matchFilter = (currentFilter === "all" && m.status !== "departed") ||
      (currentFilter === "open" && (m.status === "open" || m.status === "search")) ||
      (currentFilter !== "all" && currentFilter !== "open" && m.status === currentFilter);
    var matchSearch = !q || m.school.toLowerCase().indexOf(q) > -1 ||
      m.coach.toLowerCase().indexOf(q) > -1 || m.conf.toLowerCase().indexOf(q) > -1 ||
      m.notes.toLowerCase().indexOf(q) > -1;
    return matchFilter && matchSearch;
  });
  var el = document.getElementById("entries");
  if (!filtered.length) { el.innerHTML = '<div class="empty-msg">No results found.</div>'; return; }
  el.innerHTML = filtered.map(function (m) {
    var linkHtml = m.link ? ' <a class="intel-link" href="' + esc(m.link) + '" target="_blank" rel="noopener">📰 Latest intel</a>' : "";
    var notesHtml = m.notes ? '<div class="entry-notes">' + esc(m.notes) + linkHtml + "</div>" : (m.link ? '<div class="entry-notes">' + linkHtml + "</div>" : "");
    var logoHtml = schoolLogo(m.school);
    return '<div class="entry">' +
      '<div class="school-cell">' + logoHtml + '<div><div class="school-name">' + esc(m.school) + '</div><div class="conf">' + esc(m.conf) + "</div></div></div>" +
      '<div><div class="coach-name">' + esc(m.coach) + "</div></div>" +
      '<div>' + badge(m.status) + "</div>" +
      '<div class="entry-date">' + esc(m.date) + "</div>" +
      notesHtml + "</div>";
  }).join("");
}

function badge(status) {
  var map = { hired: ["b-hired","Hired"], open: ["b-open","Opening"], search: ["b-open","Opening"], departed: ["b-departed","Departed"] };
  var r = map[status] || ["", status];
  var pill = '<span class="badge ' + r[0] + '">' + r[1] + "</span>";
  if (status === "open" || status === "search") return '<div class="live-wrap"><span class="live-dot"></span>' + pill + "</div>";
  return pill;
}

function schoolLogo(name) {
  var id = SCHOOL_LOGO_IDS[name.toLowerCase().trim()];
  var initials = name.replace(/[^A-Za-z ]/g,"").trim().split(/\s+/).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase();
  if (id) {
    var url = "https://a.espncdn.com/i/teamlogos/ncaa/500/" + id + ".png";
    return '<img class="school-logo" src="' + url + '" alt="' + esc(name) + '" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
           '<div class="school-monogram" style="display:none">' + initials + "</div>";
  }
  return '<div class="school-monogram">' + initials + "</div>";
}

function esc(str) { return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function updateCounts() {
  var h = 0, o = 0, total = 0;
  allMoves.forEach(function (m) {
    if (m.status === "departed") return;
    total++;
    if (m.status === "hired") h++;
    else if (m.status === "open" || m.status === "search") o++;
  });
  document.getElementById("c-hired").textContent = h;
  document.getElementById("c-open").textContent = o;
  document.getElementById("c-total").textContent = total;
}
</script>
